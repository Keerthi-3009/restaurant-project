<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saffron & Sage Bistro</title>

<!-- Bootstrap + Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
  }

  /* Hero Section */
  .hero {
    background: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5') no-repeat center center/cover;
    height: 100vh;
    position: relative;
    color: white;
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
  }

  .hero-content {
    position: relative;
    z-index: 2;
  }

  .btn-custom {
    border-radius: 30px;
    padding: 10px 25px;
  }

  .logo {
    font-weight: bold;
    font-size: 24px;
    color: #ffc107 !important;
  }
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <div class="container">
    <a class="navbar-brand logo" href="#">
      <i class="bi bi-flower1"></i> Saffron & Sage
    </a>
  </div>
</nav>

<!-- Hero Section -->
<div class="hero d-flex align-items-center text-center">
  <div class="overlay"></div>

  <div class="container hero-content">
    <h1 class="display-3 fw-bold">Saffron & Sage Bistro</h1>
    <p class="lead">A Taste of Luxury & Tradition</p>

    <div class="mt-4">
      <a href="http://127.0.0.1:8000/menu" class="btn btn-warning btn-lg btn-custom me-3">
        <i class="bi bi-card-list"></i> View Menu
      </a>

      <a href="http://127.0.0.1:8000/reservation/" class="btn btn-outline-light btn-lg btn-custom">
        <i class="bi bi-calendar-check"></i> Book Table
      </a>
    </div>
  </div>
</div>

<!-- Features Section -->
<div class="container text-center my-5">
  <div class="row g-4">

    <div class="col-md-4">
      <div class="p-4 shadow rounded">
        <i class="bi bi-star-fill text-warning fs-1"></i>
        <h4 class="mt-3">Premium Quality</h4>
        <p>Fresh ingredients and top-class chefs.</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="p-4 shadow rounded">
        <i class="bi bi-emoji-smile text-success fs-1"></i>
        <h4 class="mt-3">Happy Customers</h4>
        <p>Thousands of satisfied guests.</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="p-4 shadow rounded">
        <i class="bi bi-truck text-danger fs-1"></i>
        <h4 class="mt-3">Fast Delivery</h4>
        <p>Quick and reliable service.</p>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">© 2026 Saffron & Sage Bistro | All Rights Reserved</p>
</footer>

</body>
</html>
